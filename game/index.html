<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>PULSE</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a12;overflow:hidden;
    font-family:'Segoe UI',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;background:radial-gradient(circle at 50% 42%,#141426 0%,#0a0a12 70%)}
  #hud{position:fixed;top:0;left:0;right:0;padding:18px 22px;display:flex;
    justify-content:space-between;pointer-events:none;color:#fff;z-index:5}
  .score{font-size:44px;font-weight:800;letter-spacing:1px;line-height:1;
    text-shadow:0 2px 18px rgba(90,200,255,.35)}
  .sub{font-size:13px;opacity:.55;letter-spacing:2px;margin-top:4px;text-transform:uppercase}
  #shields{margin-top:8px;font-size:15px;letter-spacing:3px;color:#5ac8ff;height:16px}
  .best{text-align:right;font-size:15px;opacity:.6;letter-spacing:1px}
  #tierhud{text-align:right;font-size:12px;letter-spacing:2px;opacity:.5;margin-top:6px;text-transform:uppercase}
  #combo{position:fixed;left:0;right:0;top:36%;text-align:center;pointer-events:none;
    color:#ffd23f;font-weight:800;font-size:26px;opacity:0;letter-spacing:1px;z-index:5}
  #milestone{position:fixed;left:0;right:0;top:47%;text-align:center;pointer-events:none;
    font-weight:900;font-size:40px;opacity:0;letter-spacing:4px;z-index:6;
    color:#fff;text-shadow:0 0 30px rgba(255,210,63,.8)}
  #msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;color:#fff;text-align:center;z-index:10;
    background:rgba(10,10,18,.72);backdrop-filter:blur(3px)}
  #msg h1{font-size:60px;margin:0;font-weight:900;letter-spacing:6px;
    background:linear-gradient(90deg,#5ac8ff,#ffd23f);-webkit-background-clip:text;
    background-clip:text;color:transparent}
  #msg p{opacity:.7;font-size:16px;letter-spacing:1px;margin:12px 0 0}
  #msg .big{font-size:20px;opacity:.9;margin-top:20px}
  .pill{margin-top:24px;padding:13px 30px;border:1.5px solid rgba(255,255,255,.25);
    border-radius:40px;font-size:14px;letter-spacing:2px;opacity:.85}
  .row{display:flex;gap:12px;margin-top:18px}
  button{font-family:inherit;cursor:pointer;color:#fff;background:rgba(255,255,255,.08);
    border:1.5px solid rgba(255,255,255,.22);border-radius:30px;padding:11px 20px;
    font-size:13px;letter-spacing:1.5px}
  button:hover{background:rgba(255,255,255,.16)}
  .swatch{width:26px;height:26px;border-radius:50%;display:inline-block;vertical-align:middle}
  .hidden{display:none!important}
  .lock{opacity:.45}
</style>

<div id="wrap"><canvas id="c"></canvas></div>
<div id="hud">
  <div><div class="score" id="score">0</div><div class="sub">Score</div><div id="shields"></div></div>
  <div class="best">BEST<br><span id="best">0</span><div id="tierhud"></div></div>
</div>
<div id="combo"></div>
<div id="milestone"></div>
<div id="msg">
  <h1>PULSE</h1>
  <p>Tap when the dot crosses the <b style="color:#5ac8ff">glowing arc</b></p>
  <p style="opacity:.5;font-size:14px">Near-misses spend a <b style="color:#5ac8ff">shield</b> 🛡 &nbsp;·&nbsp; chain hits for combos</p>
  <p class="big" id="mtip">Tap / Space to start</p>
  <div class="row" id="skinrow" data-ui></div>
  <div class="pill">ONE TAP · DON'T MISS</div>
</div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let W, H, CX, CY, R;
function resize(){
  const s = Math.min(window.innerWidth, window.innerHeight);
  W = cv.width = window.innerWidth; H = cv.height = window.innerHeight;
  CX = W/2; CY = H*0.46; R = s*0.30;
}
window.addEventListener('resize', resize); resize();

// ---- audio ----
let AC;
function beep(freq, dur=0.08, type='sine', vol=0.25){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    o.connect(g); g.connect(AC.destination);
    const t = AC.currentTime;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.start(t); o.stop(t+dur);
  }catch(e){}
}

// ---- cosmetics / progression ----
const SKINS = [
  {name:'Classic',  dot:'#ffffff', arc:'#5ac8ff', unlock:0},
  {name:'Ember',    dot:'#ffd7a1', arc:'#ff7a45', unlock:25},
  {name:'Toxic',    dot:'#eaffd0', arc:'#7CFC9E', unlock:60},
  {name:'Violet',   dot:'#f0d7ff', arc:'#b46bff', unlock:120},
  {name:'Solar',    dot:'#fff4c2', arc:'#ffd23f', unlock:250},
];
function tierFor(s){ return s>=250?'LEGEND':s>=120?'SNIPER':s>=60?'MARKSMAN':s>=25?'SHARPSHOOTER':s>=10?'ROOKIE':'NOVICE'; }
let best = +(localStorage.pulseBest||0);
let skinIdx = Math.min(SKINS.length-1, +(localStorage.pulseSkin||0));
function unlocked(i){ return best >= SKINS[i].unlock; }
if(!unlocked(skinIdx)) skinIdx = 0;
function skin(){ return SKINS[skinIdx]; }
$('best').textContent = best;
$('tierhud').textContent = tierFor(best);

function renderSkinRow(){
  const row = $('skinrow'); row.innerHTML='';
  SKINS.forEach((sk,i)=>{
    const b = document.createElement('button'); b.dataset.ui='1';
    const locked = !unlocked(i);
    b.className = locked?'lock':'';
    b.innerHTML = `<span class="swatch" style="background:${sk.arc}"></span> ${locked?('★'+sk.unlock):sk.name}`;
    if(i===skinIdx) b.style.borderColor = sk.arc;
    b.onclick = (e)=>{ e.stopPropagation(); if(locked) return;
      skinIdx=i; localStorage.pulseSkin=i; renderSkinRow(); };
    row.appendChild(b);
  });
}
renderSkinRow();

// ---- state ----
const S = { menu:0, play:1, dying:2, dead:3 };
let state = S.menu;
let score=0, combo=0, hits=0, shields=2, comboPeak=0;
let ang=0, dir=1, speed=0, targetA=0, targetHalf=0.42, gold=false;
let shake=0, ringPulse=0, flash=0, flashColor='255,255,255';
let dyingT=0, timeScale=1, tickArmed=true, reversalGlow=0;
let particles=[];
const milestonesHit=new Set();

function rand(a,b){ return a+Math.random()*(b-a); }
function angleDiff(a,b){ let d=(a-b)%(Math.PI*2); if(d>Math.PI)d-=Math.PI*2; if(d<-Math.PI)d+=Math.PI*2; return d; }

function curSpeed(){ return 2.1 + (6.2-2.1)*(1-Math.exp(-hits/55)); }

function newTarget(){
  const gap = Math.max(0.9, speed*0.16);
  let a; do { a = rand(0,Math.PI*2); } while (Math.abs(angleDiff(a,ang)) < gap);
  targetA = a;
  targetHalf = Math.max(0.18, 0.42 - hits*0.005);   // keyed to HITS, not score
  gold = Math.random() < 0.14;
  tickArmed = true;
}

function start(){
  score=0; combo=0; hits=0; shields=2; comboPeak=0;
  ang=-Math.PI/2; dir=1; speed=curSpeed(); particles=[];
  dyingT=0; timeScale=1; milestonesHit.clear();
  $('score').textContent=0; updShields();
  newTarget(); state=S.play; $('msg').classList.add('hidden');
}
function reset(){ $('msg').classList.add('hidden'); start(); }

function updShields(){ $('shields').textContent = '🛡'.repeat(shields); }

function burst(x,y,color,n){
  for(let i=0;i<n;i++){ const a=rand(0,Math.PI*2), sp=rand(1.5,7);
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color,r:rand(2,5)}); }
}
function popText(el, txt, scale){
  el.textContent=txt; el.style.transition='none'; el.style.opacity=1;
  el.style.transform='scale('+scale+')';
  requestAnimationFrame(()=>{ el.style.transition='all .6s ease-out';
    el.style.opacity=0; el.style.transform='scale(1)'; });
}

function checkMilestone(){
  [25,50,100,200,400].forEach(m=>{
    if(score>=m && !milestonesHit.has(m)){
      milestonesHit.add(m);
      popText($('milestone'), m+' · '+tierFor(m), 1.4);
      burst(CX,CY, skin().arc, 30); flash=0.4; flashColor='90,200,255';
      beep(1046,0.18,'sine',0.22); beep(1318,0.22,'sine',0.16);
    }
  });
}

function tap(){
  if(state===S.menu){ start(); return; }
  if(state===S.dead){ reset(); return; }
  if(state===S.dying) return;
  if(state!==S.play) return;

  const d = Math.abs(angleDiff(ang, targetA));
  const px=CX+Math.cos(ang)*R, py=CY+Math.sin(ang)*R;

  if(d <= targetHalf){
    // HIT
    const perfect = d <= targetHalf*0.35;
    hits++; combo++; comboPeak=Math.max(comboPeak,combo);
    let gain = (perfect?2:1)*(gold?3:1)*(1+Math.floor(combo/5)*0.5);
    gain = Math.round(gain); score += gain;
    $('score').textContent=score;
    speed = curSpeed();
    if(Math.random()<0.25){ dir*=-1; reversalGlow=1; beep(300,0.12,'sine',0.18); } // telegraphed reversal
    burst(px,py, gold?'#ffd23f':(perfect?skin().arc:'#7CFC9E'), gold?26:(perfect?16:10));
    shake=perfect?9:5; ringPulse=1; flash=gold?0.5:0; flashColor='255,255,255';
    beep((gold?880:(perfect?660:520))+combo*6, 0.09,'triangle',0.28);
    if(combo>0 && combo%5===0){ popText($('combo'),'COMBO ×'+(1+Math.floor(combo/5)*0.5),1.25); beep(990,0.14,'sine',0.2); }
    if(score>=(shields+1)*20 && shields<3){ shields++; updShields(); beep(1200,0.12,'sine',0.18); }
    checkMilestone();
    newTarget();
  } else if(d <= targetHalf*2.1 && shields>0){
    // GRAZE — near-miss spends a shield, run survives
    shields--; updShields(); combo=0;
    burst(px,py,'#5ac8ff',14); shake=7; ringPulse=1; flash=0.25; flashColor='90,200,255';
    beep(220,0.14,'square',0.22);
    newTarget();
  } else {
    die(px,py);
  }
}

function die(px,py){
  state=S.dying; dyingT=0; shake=18; flash=0.7; flashColor='255,77,109';
  burst(px||CX,py||CY,'#ff4d6d',34); beep(160,0.35,'sawtooth',0.3);
}

function finalizeDeath(){
  state=S.dead;
  const isBest = score>best;
  if(isBest){ best=score; localStorage.pulseBest=best; $('best').textContent=best; $('tierhud').textContent=tierFor(best); }
  let head, sub;
  if(isBest && score>0){ head='NEW BEST!'; sub='You beat your record'; }
  else if(best>0 && score>=best*0.8 && score<best){ head='SO CLOSE'; sub=(best-score)+' from your BEST'; }
  else { head='GAME OVER'; sub='Best '+best; }
  const mult=(1+Math.floor(comboPeak/5)*0.5).toFixed(1);
  const m=$('msg'); m.classList.remove('hidden');
  m.innerHTML =
    `<h1 style="font-size:34px;letter-spacing:3px">${head}</h1>`+
    `<p class="big" style="font-size:54px;margin-top:4px;color:#fff;-webkit-text-fill-color:#fff">${score}</p>`+
    `<p style="opacity:.6">${sub} &nbsp;·&nbsp; ${tierFor(score)} &nbsp;·&nbsp; combo peaked ×${mult}</p>`+
    (justUnlocked.length?`<p style="color:#ffd23f;-webkit-text-fill-color:#ffd23f;margin-top:14px">✦ SKIN UNLOCKED: ${justUnlocked.join(', ')}</p>`:'')+
    `<div class="row" data-ui>`+
      `<button data-ui id="copyBtn">COPY SCORE</button>`+
      `<button data-ui id="againBtn">PLAY AGAIN ▸</button>`+
    `</div>`+
    `<p style="opacity:.35;font-size:12px;margin-top:20px">tap anywhere to retry</p>`;
  $('againBtn').onclick=e=>{ e.stopPropagation(); reset(); };
  $('copyBtn').onclick=e=>{ e.stopPropagation();
    const txt=`PULSE — ${score} pts · ${tierFor(score)} · combo ×${mult} 🎯 can you beat it?`;
    try{ navigator.clipboard.writeText(txt); $('copyBtn').textContent='COPIED ✓'; }
    catch(_){ $('copyBtn').textContent=txt; } };
}

// track skins unlocked before this run so we can celebrate new ones
let unlockedBefore = new Set();
let justUnlocked = [];
function snapshotUnlocks(){ unlockedBefore=new Set(SKINS.filter(s=>best>=s.unlock&&s.unlock>0).map(s=>s.unlock)); }
snapshotUnlocks();

// ---- loop ----
let last=performance.now();
function frame(now){
  let rdt=Math.min(0.05,(now-last)/1000); last=now;

  if(state===S.dying){
    dyingT+=rdt;
    timeScale = dyingT<0.12 ? 0.08 : Math.min(1,0.08+(dyingT-0.12)*2);
    if(dyingT>0.55){
      justUnlocked = SKINS.filter(s=>s.unlock>0 && score>=s.unlock && !unlockedBefore.has(s.unlock)).map(s=>s.name);
      finalizeDeath();
    }
  } else timeScale=1;
  const dt=rdt*timeScale;

  if(state===S.play){
    ang += dir*speed*dt;
    if(ang>Math.PI*2)ang-=Math.PI*2; if(ang<0)ang+=Math.PI*2;
    // approach telegraph tick
    const d=Math.abs(angleDiff(ang,targetA));
    if(d<0.32 && tickArmed){ beep(700,0.04,'sine',0.07); tickArmed=false; }
    if(d>0.7) tickArmed=true;
  }

  shake*=0.86; ringPulse*=0.90; flash*=0.88; reversalGlow*=0.90;
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.vx*=0.97; p.life-=rdt*1.6; });
  particles=particles.filter(p=>p.life>0);

  ctx.clearRect(0,0,W,H);
  const sx=(Math.random()-0.5)*shake, sy=(Math.random()-0.5)*shake;
  ctx.save(); ctx.translate(sx,sy);

  // base ring (glows on reversal)
  ctx.lineWidth=6;
  ctx.strokeStyle='rgba('+(reversalGlow>0.05?'255,210,63':'255,255,255')+','+(0.10+ringPulse*0.25+reversalGlow*0.4)+')';
  ctx.beginPath(); ctx.arc(CX,CY,R+ringPulse*8,0,Math.PI*2); ctx.stroke();

  if(state!==S.menu){
    const sk=skin();
    // graze band (faint) so near-miss zone is legible
    if(state===S.play && shields>0){
      ctx.lineWidth=20; ctx.strokeStyle='rgba(90,200,255,.10)';
      ctx.beginPath(); ctx.arc(CX,CY,R,targetA-targetHalf*2.1,targetA+targetHalf*2.1); ctx.stroke();
    }
    // target arc
    ctx.lineWidth=14; ctx.lineCap='round';
    ctx.strokeStyle=gold?'#ffd23f':sk.arc;
    ctx.shadowColor=ctx.strokeStyle; ctx.shadowBlur=22;
    ctx.beginPath(); ctx.arc(CX,CY,R,targetA-targetHalf,targetA+targetHalf); ctx.stroke();
    ctx.shadowBlur=0; ctx.lineCap='butt';
    // dot — scales up + brightens as it nears the arc (strike telegraph)
    const d=Math.abs(angleDiff(ang,targetA)), p=Math.max(0,1-d/0.6);
    const dx=CX+Math.cos(ang)*R, dy=CY+Math.sin(ang)*R;
    ctx.fillStyle=sk.dot; ctx.shadowColor=sk.dot; ctx.shadowBlur=14+p*26;
    ctx.beginPath(); ctx.arc(dx,dy,9+p*6,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  }

  particles.forEach(p=>{ ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); });
  ctx.globalAlpha=1; ctx.restore();

  if(flash>0.01){ ctx.fillStyle='rgba('+flashColor+','+flash*0.5+')'; ctx.fillRect(0,0,W,H); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- input ----
function onDown(e){
  if(e.target.closest&&e.target.closest('[data-ui]')) return; // let real buttons work
  e.preventDefault(); if(AC&&AC.state==='suspended')AC.resume(); tap();
}
window.addEventListener('mousedown', onDown);
window.addEventListener('touchstart', onDown, {passive:false});
window.addEventListener('keydown', e=>{ if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); if(AC&&AC.state==='suspended')AC.resume(); tap(); }});
</script>
