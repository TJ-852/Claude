<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="disabled-adaptations" content="watch">
<title>Palindrome</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a12;overflow:hidden;
    font-family:'Segoe UI',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;background:radial-gradient(circle at 50% 42%,#141426 0%,#0a0a12 70%)}
  #hud{position:fixed;top:0;left:0;right:0;padding:18px 22px;display:flex;
    justify-content:space-between;pointer-events:none;color:#fff;z-index:5}
  .score{font-size:44px;font-weight:800;letter-spacing:1px;line-height:1;
    text-shadow:0 2px 18px rgba(90,200,255,.35)}
  .sub{font-size:13px;opacity:.55;letter-spacing:2px;margin-top:4px;text-transform:uppercase}
  #shields{margin-top:8px;font-size:15px;letter-spacing:3px;color:#5ac8ff;height:16px}
  #quest{margin-top:7px;font-size:12px;letter-spacing:1px;color:#9fd8ff;opacity:.85;max-width:46vw}
  #zen{margin-top:4px;font-size:12px;letter-spacing:1px;color:#9fe8c8;opacity:.85;height:14px}
  .best{text-align:right;font-size:15px;opacity:.6;letter-spacing:1px}
  #tierhud{text-align:right;font-size:12px;letter-spacing:2px;opacity:.5;margin-top:6px;text-transform:uppercase}
  #nextgoal{text-align:right;font-size:11px;letter-spacing:1px;opacity:.45;margin-top:4px}
  #mode{position:fixed;top:14px;left:0;right:0;text-align:center;pointer-events:none;
    font-size:12px;letter-spacing:3px;opacity:.5;color:#ffd23f;z-index:5;text-transform:uppercase}
  #combo{position:fixed;left:0;right:0;top:34%;text-align:center;pointer-events:none;
    color:#ffd23f;font-weight:800;font-size:26px;opacity:0;letter-spacing:1px;z-index:5}
  #milestone{position:fixed;left:0;right:0;top:47%;text-align:center;pointer-events:none;
    font-weight:900;font-size:40px;opacity:0;letter-spacing:4px;z-index:6;
    color:#fff;text-shadow:0 0 30px rgba(255,210,63,.8)}
  #chest{position:fixed;left:0;right:0;top:60%;text-align:center;pointer-events:none;
    color:#7CFC9E;font-weight:800;font-size:22px;opacity:0;letter-spacing:1px;z-index:6}
  #msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;color:#fff;text-align:center;z-index:10;
    background:rgba(10,10,18,.72);backdrop-filter:blur(3px);padding:20px;box-sizing:border-box;overflow-y:auto}
  #msg h1{font-size:46px;margin:0;font-weight:900;letter-spacing:5px;
    background:linear-gradient(90deg,#5ac8ff,#ffd23f);-webkit-background-clip:text;
    background-clip:text;color:transparent}
  #msg p{opacity:.7;font-size:15px;letter-spacing:1px;margin:11px 0 0}
  #msg .big{font-size:20px;opacity:.9;margin-top:18px}
  .go-head{font-size:34px !important;letter-spacing:3px !important}
  .go-score{font-size:54px;margin-top:4px;color:#fff;-webkit-text-fill-color:#fff}
  .wordmark{font-weight:900;letter-spacing:7px;font-size:17px;
    background:linear-gradient(90deg,#5ac8ff,#ffd23f);-webkit-background-clip:text;
    background-clip:text;color:transparent;opacity:.95;margin-bottom:2px}
  #tally{margin-top:12px;font-size:15px;line-height:1.85;letter-spacing:1px;min-width:250px}
  .tl{display:flex;justify-content:space-between;gap:18px;opacity:0;transform:translateY(6px);transition:all .25s ease-out}
  .tl.in{opacity:.85;transform:none}
  .tl .lab{opacity:.7}
  .tl b{font-variant-numeric:tabular-nums}
  @keyframes pulseBtn{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  .holding{background:rgba(255,210,63,.3)!important;border-color:#ffd23f!important}
  .pulse{animation:pulseBtn 1.2s ease-in-out infinite;border-color:#ffd23f!important}
  .pill{margin-top:22px;padding:12px 28px;border:1.5px solid rgba(255,255,255,.25);
    border-radius:40px;font-size:13px;letter-spacing:2px;opacity:.85}
  .row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center}
  button{font-family:inherit;cursor:pointer;color:#fff;background:rgba(255,255,255,.08);
    border:1.5px solid rgba(255,255,255,.22);border-radius:30px;padding:10px 18px;
    font-size:12px;letter-spacing:1.5px}
  button:hover{background:rgba(255,255,255,.16)}
  button:focus-visible{outline:2px solid #5ac8ff;outline-offset:2px}
  .swatch{width:22px;height:22px;border-radius:50%;display:inline-block;vertical-align:middle}
  #meta{margin-top:16px;font-size:13px;opacity:.6;letter-spacing:1px;line-height:1.8}
  .hidden{display:none!important}
  .lock{opacity:.4}
  .on{border-color:#ffd23f!important;color:#ffd23f}
  @media (max-width:290px){
    #hud{padding:8px 10px}
    .score{font-size:24px}.sub{font-size:8px;letter-spacing:1px;margin-top:2px}
    #shields{font-size:10px;margin-top:3px;letter-spacing:1px}
    #quest{font-size:8px;max-width:58vw;margin-top:3px}
    #zen{font-size:8px;margin-top:2px;height:9px}
    #nextgoal{font-size:7px;margin-top:2px}
    .best{font-size:9px}#tierhud{font-size:7px;margin-top:2px}
    #mode{font-size:7px;top:4px;letter-spacing:1px}
    #combo{font-size:13px}#milestone{font-size:18px;letter-spacing:2px}#chest{font-size:11px}
    #msg{padding:8px;justify-content:flex-start}
    #msg h1{font-size:20px;letter-spacing:2px}
    #msg p{font-size:9px;margin:4px 0 0;letter-spacing:.5px}
    #msg .big{font-size:11px;margin-top:6px}
    .go-head{font-size:16px !important;letter-spacing:1px !important}
    .go-score{font-size:26px;margin-top:2px}
    .wordmark{font-size:9px;letter-spacing:3px}
    #tally{font-size:9px;min-width:150px;line-height:1.7;margin-top:6px}
    .pill{padding:5px 12px;font-size:8px;margin-top:8px;letter-spacing:1px}
    .row{gap:5px;margin-top:8px}
    button{padding:5px 9px;font-size:8px;letter-spacing:.5px}
    .swatch{width:12px;height:12px}
    #meta{font-size:8px;line-height:1.5;margin-top:8px;letter-spacing:.5px}
  }
</style>

<div id="wrap"><canvas id="c"></canvas></div>
<div id="mode"></div>
<div id="hud">
  <div><div class="score" id="score">0</div><div class="sub">Score</div><div id="shields"></div><div id="quest"></div><div id="zen"></div></div>
  <div class="best">BEST<br><span id="best">0</span><div id="tierhud"></div><div id="nextgoal"></div></div>
</div>
<div id="combo"></div>
<div id="milestone"></div>
<div id="chest"></div>
<div id="msg">
  <h1>PALINDROME</h1>
  <p>Tap inside the <b style="color:#5ac8ff">glowing arc</b> — an <b>early</b> tap bounces you back, a <b>late</b> tap carries you on</p>
  <p style="opacity:.5;font-size:13px">Dead-centre <b style="color:#ffd23f">SPLITS</b> the dot in two · centre taps leave calm, edge taps leave hot · a near-miss spends a <b style="color:#5ac8ff">shield</b> 🛡</p>
  <div id="meta"></div>
  <div class="row" data-ui><button data-ui id="dailyBtn">DAILY RUN</button><button data-ui id="vsBtn">⚔ VS</button><button data-ui id="duelBtn">⚔ DUEL 2P</button></div>
  <div class="row" id="skinrow" data-ui></div>
  <p class="big" id="mtip">Tap / Space to start</p>
  <div class="pill">ONE TAP · WRITE IT BACKWARDS</div>
</div>

<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const TINY=Math.min(window.innerWidth,window.innerHeight)<=290;
let W,H,CX,CY,R;
function resize(){ const s=Math.min(window.innerWidth,window.innerHeight);
  W=cv.width=window.innerWidth; H=cv.height=window.innerHeight; CX=W/2; CY=H*(TINY?0.5:0.46); R=s*(TINY?0.36:0.30); }
window.addEventListener('resize',resize); resize();
function blur(v){ return TINY?v*0.35:v; }

// ---- audio / haptics ----
let AC;
function beep(freq,dur=0.08,type='sine',vol=0.25,delay=0){
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(AC.destination);
    const t=AC.currentTime+delay; g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur); o.start(t); o.stop(t+dur);
  }catch(e){}
}
function chime(f1,f2){ beep(f1,0.10,'sine',0.22); beep(f2,0.16,'sine',0.15); }
function buzz(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

// ---- deterministic RNG (daily seeded runs) ----
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
let rng=Math.random;
function fmtDate(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function todayStr(){ return fmtDate(new Date()); }
function dailySeed(){ const s=todayStr(); let h=2166136261;
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function dailyBestToday(){ return +(localStorage['pulseDaily_'+todayStr()]||0); }

// ---- progression / cosmetics (storage keys keep the legacy "pulse" prefix so progress survives the rename) ----
const SKINS=[
  {name:'Classic',  dot:'#ffffff',arc:'#5ac8ff',unlock:0},
  {name:'Ember',    dot:'#ffd7a1',arc:'#ff7a45',unlock:25},
  {name:'Toxic',    dot:'#eaffd0',arc:'#7CFC9E',unlock:60},
  {name:'Violet',   dot:'#f0d7ff',arc:'#b46bff',unlock:120},
  {name:'Solar',    dot:'#fff4c2',arc:'#ffd23f',unlock:250},
  {name:'Ascendant',dot:'#c8fff4',arc:'#00ffd0',unlock:0,asc:1},
  {name:'Phantom',  dot:'#10131f',arc:'#f5f7ff',unlock:0,secret:true}, // hidden: 3 lifetime perfects while split
];
function tierFor(s){ return s>=250?'LEGEND':s>=120?'SNIPER':s>=60?'MARKSMAN':s>=25?'SHARPSHOOTER':s>=10?'ROOKIE':'NOVICE'; }
const ASC=[500,1000,2000,4000,8000,16000];
function ascRank(lt){ let r=0; ASC.forEach(t=>{ if(lt>=t) r++; }); return r; }
const PHASE_COLS=['#5ac8ff','#b46bff','#ff7a45','#7CFC9E','#ffd23f','#ff4d6d'];
const MILESTONES=[25,50,100,200,400,700,1000];

let best=+(localStorage.pulseBest||0);
let lifetime=+(localStorage.pulseLifetime||0);
let streak=+(localStorage.pulseStreak||0);
let statChests=+(localStorage.pulseChests||0);
let statPerfects=+(localStorage.pulsePerfects||0);
let statComets=+(localStorage.pulseComets||0);
let statSplits=+(localStorage.pulseSplits||0);
let statSplitBest=+(localStorage.pulseSplitBest||0);
let statZenBest=+(localStorage.pulseZenBest||0);
let statCrowns=+(localStorage.pulseCrowns||0);
let revPerfects=+(localStorage.pulseRevPerfects||0); // now counts perfects landed while split
let questsDone=+(localStorage.pulseQuests||0);
let lastRunScore=+(localStorage.pulseLast||0);
let skinIdx=Math.min(SKINS.length-1,+(localStorage.pulseSkin||0));
function unlocked(i){ const sk=SKINS[i];
  if(sk.secret) return localStorage.pulsePhantom==='1';
  return sk.asc ? ascRank(lifetime)>=sk.asc : best>=sk.unlock; }
if(!unlocked(skinIdx)) skinIdx=0;
function skin(){ return SKINS[skinIdx]; }

function refreshMeta(){
  $('best').textContent=best; $('tierhud').textContent=tierFor(best);
  if(!$('meta')) return;
  const asc=ascRank(lifetime), next=ASC[asc];
  const playedToday=localStorage.pulseLastDay===todayStr();
  const streakLine = streak>0 && !playedToday
    ? `🔥 <b>Day ${streak}</b> — play today to keep it!`
    : `🔥 <b>Day ${streak||0}</b> streak`;
  $('meta').innerHTML =
    streakLine+` &nbsp;·&nbsp; Lifetime <b>${lifetime}</b> pts` +
    (asc>0?` &nbsp;·&nbsp; <b style="color:#ffd23f">Ascension ${asc}</b>`:'') +
    (next?`<br><span style="opacity:.55;font-size:.92em">${next-lifetime} lifetime pts to Ascension ${asc+1}${ascPerkHint(asc+1)}</span>`:'<br><span style="opacity:.55;font-size:.92em">Max ascension reached</span>') +
    (dailyBestToday()?`<br><span style="opacity:.55;font-size:.92em">Today's daily best: <b>${dailyBestToday()}</b></span>`:'') +
    `<br><span style="opacity:.45;font-size:.92em">📦 ${statChests} · 🎯 ${statPerfects} · ◆ ${questsDone} · ⧉ ${statSplits}${statSplitBest?' (best run '+statSplitBest+')':''}${statZenBest>=3?' · ☯ '+statZenBest:''}${statCrowns?' · 👑 '+statCrowns:''}${statComets?' · ☄ '+statComets:''}${localStorage.pulsePhantom==='1'?' · 👻 '+revPerfects:''}</span>`;
}
function ascPerkHint(r){ return r===1?' (skin)':r===2?' (+1 start shield)':r===3?' (dot trail)':''; }
function renderSkinRow(){
  const row=$('skinrow'); if(!row) return; row.innerHTML='';
  SKINS.forEach((sk,i)=>{ const b=document.createElement('button'); b.dataset.ui='1';
    const locked=!unlocked(i); b.className=locked?'lock':'';
    b.innerHTML=`<span class="swatch" style="background:${sk.arc}"></span> ${locked?(sk.secret?'???':(sk.asc?('ASC '+sk.asc):('★'+sk.unlock))):sk.name}`;
    if(i===skinIdx) b.style.borderColor=sk.arc;
    b.onclick=e=>{ e.stopPropagation(); if(locked) return; skinIdx=i; localStorage.pulseSkin=i; renderSkinRow(); };
    row.appendChild(b); });
}
let dailyMode=false;
function refreshDailyBtn(){ const b=$('dailyBtn');
  if(b){ b.className=dailyMode?'on':''; b.textContent=dailyMode?'DAILY RUN ✓ (2× lifetime)':'DAILY RUN'; }
  $('mode').textContent = duel ? ('PALINDROME · DUEL · PLAYER '+duel.stage)
    : (dailyMode ? ('DAILY · '+todayStr()+(rivalTarget?(' · VS '+rivalTarget):(dailyBestToday()?(' · BEST '+dailyBestToday()):''))) : ''); }
function wireModeButtons(){
  const db=$('dailyBtn'); if(db) db.onclick=e=>{ e.stopPropagation();
    dailyMode=!dailyMode; if(!dailyMode) rivalTarget=0; refreshDailyBtn(); };
  const vb=$('vsBtn'); if(vb) vb.onclick=e=>{ e.stopPropagation(); let v=0;
    try{ v=parseInt(prompt("Rival's score to beat (today's DAILY seed):")||'0',10); }catch(_){}
    if(v>0){ rivalTarget=v; dailyMode=true; } refreshDailyBtn(); };
  const ub=$('duelBtn'); if(ub) ub.onclick=e=>{ e.stopPropagation();
    duel={seed:(Math.random()*4294967296)>>>0, stage:1, p1:0}; dailyMode=false; rivalTarget=0; start(); };
}
function wireHold(btn,fn){ if(!btn) return; let t=null;
  const down=e=>{ e.stopPropagation(); e.preventDefault(); btn.classList.add('holding');
    t=setTimeout(()=>{ btn.classList.remove('holding'); t=null; fn(); },600); };
  const up=()=>{ if(t){ clearTimeout(t); t=null; } btn.classList.remove('holding'); };
  btn.addEventListener('mousedown',down); btn.addEventListener('touchstart',down,{passive:false});
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=>btn.addEventListener(ev,up));
}
refreshMeta(); renderSkinRow();
setTimeout(()=>{ wireModeButtons(); refreshDailyBtn(); },0);

// ---- state ----
const S={menu:0,play:1,dying:2,dead:3};
let state=S.menu;
let score=0,combo=0,hits=0,shields=2,comboPeak=0;
let perfectStreak=0,sinceShield=0,jackpotHits=0,phase=0;
let runChests=0,runPerfects=0,runComets=0,runSplits=0;
let dots=[{ang:-Math.PI/2,dir:1}];            // the palindrome: tap placement writes each dot's direction
let speed=0,targetA=0,targetHalf=0.42,gold=false;
let shake=0,ringPulse=0,flash=0,flashColor='255,255,255',reversalGlow=0;
let dyingT=0,timeScale=1,slowmoT=0,slowmoS=1,hbT=0,tintHits=0,nextChest=0;
let tickIdx=0;
let particles=[],shocks=[],trail=[],vtrail=[];
const milestonesHit=new Set();
let eclipseUsed=false,eclipseActive=false;
let cometUsed=false,cometActive=false;
let overclockLeft=0,nextOverclock=0;
let recordBroken=false,recordHits=0;
let palindromesSeen=new Set();
let quest=null,qrng=Math.random,runQuests=0,revenged=false;
let blinkT=0,blinkNext=7,blinkOn=0,deathInfo=null,shrinkHits=0;
let lastActor=0,splitRun=0,runSplitBest=0,zen=0;
let judgedIdx=0,lastRev=false,runZenBest=0,zenRecordShown=false,splitRecordShown=false;
let led={hit:0,perf:0,chest:0,quest:0,zen:0,ecl:0,rev:0};   // the score ledger — every point has a story
let tallyDone=true,tallyEndT=0,tallySkip=null,tightSpawn=false;
let rivalTarget=0,crowned=false,duel=null;
const NOTES=[262,294,330,392,440,523,587,659,784,880];
const TICKB=[0.28,0.20,0.13,0.07], TICKF=[470,600,760,950];

function rand(a,b){ return a+Math.random()*(b-a); }
function angleDiff(a,b){ let d=(a-b)%(Math.PI*2); if(d>Math.PI)d-=Math.PI*2; if(d<-Math.PI)d+=Math.PI*2; return d; }
function curSpeed(){ return 2.1 + (6.2-2.1)*(1-Math.exp(-hits/55)) + Math.max(0,hits-60)*0.004; }
function curHalf(){ return 0.13 + 0.29*Math.exp(-hits/120); }
function effSpeed(){ return speed*(overclockLeft>0?1.6:1)*(dots.length>1?1.25:1); } // split play runs hotter — a wager, not insurance
function exitMult(frac){ return Math.min(2.0, 0.8 + 1.2*Math.pow(frac,3)); } // calm centre (no parking lane); edge launches HOT
function nearestDot(){ let bi=0,bd=1e9;
  dots.forEach((dt,i)=>{ const d=Math.abs(angleDiff(dt.ang,targetA)); if(d<bd){ bd=d; bi=i; } });
  return {i:bi,d:bd}; }

function newTarget(){
  eclipseActive=false; cometActive=false;
  // in DUEL, every roll is keyed to the hit counter so both players meet the same events at the same hits
  const dr = duel ? mulberry32((duel.seed ^ ((hits+1)*2654435761))>>>0) : null;
  const rr = ()=> dr ? dr() : rng();
  const gap=Math.min(Math.PI*0.85, Math.max(0.9, effSpeed()*0.22));
  // targets spawn AHEAD of the acting dot's heading; a REVERSE routes closer-but-tighter
  const ref=dots[Math.min(lastActor,dots.length-1)]||dots[0];
  const clear=gap*(lastRev?0.5:0.8);
  const roll=()=>ref.ang+ref.dir*( lastRev ? (gap*0.6+rr()*1.0) : (gap+rr()*1.7) );
  let a=roll();
  for(let t=0;t<40;t++){
    if(dots.every(dt=>Math.abs(angleDiff(a,dt.ang))>=clear)) break;
    a=roll();
  }
  a=((a%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
  targetA=a;
  targetHalf=curHalf()*(overclockLeft>0?1.5:1)*(TINY?1.15:1)*(shrinkHits>0?0.7:1)*(dots.length>1?0.85:1)*(lastRev?0.9:1);
  tightSpawn=lastRev;
  if(shrinkHits>0) shrinkHits--;
  gold = tintHits>0 ? true : (rr()<0.14);
  if(overclockLeft===0){
    if(!duel && !eclipseUsed && hits>=30 && rr()<0.008){
      eclipseActive=true; eclipseUsed=true; gold=false;
      popText($('milestone'),'ECLIPSE',1.5); beep(196,0.5,'sine',0.12);
    } else if(!duel && !cometUsed && hits>=20 && rr()<0.007){
      cometActive=true; cometUsed=true;
      popText($('chest'),'☄ COMET · ×10',1.35); chime(659,880);
    } else if(nextOverclock>0 && hits>=nextOverclock){
      overclockLeft=3; nextOverclock=hits+(duel?38:35+Math.floor(rng()*10));
      targetHalf=curHalf()*1.5*(TINY?1.15:1);
      popText($('milestone'),'OVERCLOCK ×2',1.5);
      beep(TICKF[1],0.06,'square',0.15); beep(TICKF[2],0.06,'square',0.15); beep(TICKF[3],0.09,'square',0.18);
    }
  }
  tickIdx=0;
}

const QUEST_POOL=[
  {type:'gold',need:3,reward:40,label:'Hit 3 gold arcs'},
  {type:'perfect',need:4,reward:40,label:'Land 4 perfects'},
  {type:'chain',need:12,reward:50,label:'Reach combo 12'},
  {type:'chest',need:2,reward:30,label:'Open 2 chests'},
  {type:'rev',need:3,reward:40,label:'Reverse 3 times'},
  {type:'split',need:1,reward:60,label:'Split the dot'},
  {type:'splithits',need:8,reward:70,label:'Survive 8 hits split'},
  {type:'splitperfect',need:2,reward:80,label:'2 perfects while split'},
  {type:'clean',need:15,reward:50,label:'15 hits, no graze'},
];
function newQuest(){
  const q=QUEST_POOL[Math.floor(qrng()*QUEST_POOL.length)];
  quest={...q,got:0,start:hits}; updQuestHUD();
}
function updQuestHUD(){ const el=$('quest'); if(!el) return;
  el.textContent = quest ? '◆ '+quest.label+' · '+Math.min(quest.got,quest.need)+'/'+quest.need : ''; }
function checkQuest(){
  if(!quest||quest.got<quest.need) return;
  score+=quest.reward; led.quest+=quest.reward; $('score').textContent=score;
  questsDone++; runQuests++; localStorage.pulseQuests=questsDone;
  popText($('combo'),'◆ QUEST · +'+quest.reward,1.25); chime(988,1319); buzz(15);
  newQuest(); updNextGoal();
}
function updNextGoal(){ const el=$('nextgoal'); if(!el) return;
  if(rivalTarget>0 && score<=rivalTarget){ el.textContent='👑 VS '+rivalTarget+' · −'+(rivalTarget-score+1); return; }
  const nm=MILESTONES.find(m=>m>score);
  el.textContent = nm ? ('NEXT '+nm+' · −'+(nm-score)) : ''; }

function tap(){
  if(state===S.menu){ start(); return; }
  if(state===S.dead){
    if(!tallyDone){ if(tallySkip) tallySkip(); return; }  // first tap completes the tally
    if(duel) return;                                      // duel flow is button-driven — no accidental handoffs
    if(performance.now()-tallyEndT<350) return;           // debounce so the skip-tap can't restart
    reset(); return; }
  if(state===S.dying) return;
  if(state!==S.play) return;

  const ji = dots.length>1 ? Math.min(judgedIdx,dots.length-1) : 0;
  const dot=dots[ji], d=Math.abs(angleDiff(dot.ang,targetA));
  lastActor=ji;
  const px=CX+Math.cos(dot.ang)*R, py=CY+Math.sin(dot.ang)*R;

  if(d<=targetHalf){
    const frac=d/targetHalf;
    // perfect zone: floor 0.12×arc, cap 0.22×arc — strictly inside the zen band at every speed
    const perfect = d <= Math.min(targetHalf*0.22, Math.max(targetHalf*0.12, effSpeed()*0.02));
    const wasEclipse=eclipseActive, wasComet=cometActive;
    // the palindrome rule: before the midpoint bounces you back; past it carries you on
    const beforeMid = angleDiff(targetA,dot.ang)*dot.dir > 0;
    let didReverse=false, didSplit=false;
    if(perfect && dots.length===1){
      didSplit=true;                                      // dead centre: the dot splits in two
      dots=[{ang:dot.ang,dir:1},{ang:dot.ang,dir:-1}];
      splitRun=0; try{ $('shields').style.opacity=.25; }catch(e){}
    } else if(!perfect && beforeMid){ dot.dir*=-1; didReverse=true; reversalGlow=1;
      beep(494,0.05,'sine',0.13); beep(349,0.1,'sine',0.13,0.07); }  // a TRUE falling two-note: you turned around
    hits++; combo++; comboPeak=Math.max(comboPeak,combo); sinceShield++;
    if(tintHits>0) tintHits--;
    let gain=(perfect?2:1)*(gold?3:1)*(1+Math.floor(combo/5)*0.5);
    if(jackpotHits>0){ gain*=2; jackpotHits--; }
    if(overclockLeft>0){ gain*=2; overclockLeft--; }
    if(dots.length>1 && !didSplit){ gain*=1.5; }          // split pay: the wager's carrot
    if(didReverse){ gain*=1.3; }                          // reverse pay: closer-and-tighter earns it
    if(wasComet){ gain*=10; }
    gain=Math.round(gain); score+=gain;
    led[perfect?'perf':'hit']+=gain;
    if(wasEclipse){ const bounty=25+combo; score+=bounty; led.ecl+=bounty;
      popText($('chest'),'☀ +'+(gain+bounty),1.4);
      flash=0.9; flashColor='255,255,240'; chime(523,659); beep(784,0.3,'sine',0.2); }
    if(wasComet){ runComets++;
      popText($('chest'),'☄ ×10 · +'+gain,1.4);
      burst(px,py,'#ffd23f',40); flash=0.6; flashColor='140,220,255';
      chime(523,784); beep(1046,0.25,'sine',0.2); }
    $('score').textContent=score;
    if(!duel && !revenged && lastRunScore>=10 && score>lastRunScore && best!==lastRunScore){
      revenged=true; score+=10; led.rev+=10; $('score').textContent=score;
      popText($('combo'),'⚔ REVENGED · +10',1.2); beep(587,0.1,'sine',0.2); beep(880,0.14,'sine',0.18); buzz(15); }
    if(rivalTarget>0 && !crowned && score>rivalTarget){
      crowned=true; statCrowns++; localStorage.pulseCrowns=statCrowns;
      popText($('milestone'),'👑 CROWN TAKEN',1.5); flash=0.5; flashColor='255,210,63'; chime(1318,1760); buzz([20,40,20]); }
    if(quest){
      if(quest.type==='gold'&&gold) quest.got++;
      else if(quest.type==='perfect'&&perfect) quest.got++;
      else if(quest.type==='chain') quest.got=Math.max(quest.got,combo);
      else if(quest.type==='rev'&&didReverse) quest.got++;
      else if(quest.type==='split'&&didSplit) quest.got++;
      else if(quest.type==='splithits'&&dots.length>1&&!didSplit) quest.got++;
      else if(quest.type==='splitperfect'&&perfect&&dots.length>1&&!didSplit) quest.got++;
      else if(quest.type==='clean') quest.got=hits-quest.start;
      updQuestHUD(); checkQuest(); }
    updNextGoal();
    if(!recordBroken && best>0 && score>best){
      recordBroken=true; slowmoT=0.3; slowmoS=0.3;
      popText($('milestone'),'RECORD ⚡',1.5);
      burst(CX+Math.cos(dot.ang+Math.PI)*R, CY+Math.sin(dot.ang+Math.PI)*R, '#ffd23f', 26);
      flash=0.5; flashColor='255,210,63'; chime(1318,1568);
      $('score').style.color='#ffd23f';
    }
    if(recordBroken) recordHits++;
    // split streak + zen lane
    if(dots.length>1 && !didSplit){ splitRun++; runSplitBest=Math.max(runSplitBest,splitRun);
      if(splitRun%5===0){ popText($('combo'),'⧉ SURVIVED ×'+splitRun,1.2); chime(880,1046); }
      if(!splitRecordShown && runSplitBest>statSplitBest && runSplitBest>=5){ splitRecordShown=true;
        popText($('combo'),'⧉ BEST RUN!',1.2); chime(988,1175); } }
    if(frac<0.25){ zen++; runZenBest=Math.max(runZenBest,zen);
      if(zen===3){ popText($('combo'),'☯ ZEN · +5/hit',1.15); chime(523,659); }
      if(zen>=3){ score+=5; led.zen+=5; $('score').textContent=score; beep(1318,0.03,'sine',0.05); }
      if(!zenRecordShown && zen>Math.max(statZenBest,3)){ zenRecordShown=true;
        popText($('combo'),'☯ ZEN BEST!',1.2); chime(1046,1319); }
    } else zen=0;
    updZen();
    speed = curSpeed()*exitMult(frac);                    // calm centre exits, hot edge exits
    if(frac>0.8){ shrinkHits=1;                           // deterministic: every outer-edge tap tightens the next arc
      popText($('chest'),'⌁ TIGHT ARC',1.2); beep(233,0.15,'sawtooth',0.14); }
    burst(px,py, gold?'#ffd23f':(perfect?skin().arc:'#7CFC9E'), gold?26:(perfect?16:10));
    shake=perfect?9:5; ringPulse=1; if(!wasEclipse&&!wasComet){ flash=gold?0.5:0; flashColor='255,255,255'; }
    if(didSplit){
      runSplits++;
      popText($('milestone'),'⧉ SPLIT',1.5);
      shockwave(px,py,skin().arc); shockwave(px,py,'#ffd23f');
      slowmoT=0.18; slowmoS=0.1; flash=0.4; flashColor='255,255,255';
      chime(659,988); beep(1319,0.2,'sine',0.18); buzz([15,30,15,30,15]);
    }
    if(perfect){
      perfectStreak++; runPerfects++; buzz([12,30,12]);
      if(dots.length===2 && !didSplit){                   // the hidden road to Phantom
        revPerfects++; localStorage.pulseRevPerfects=revPerfects;
        if(revPerfects===10||revPerfects===25||revPerfects===50){
          popText($('milestone'),'👻 ×'+revPerfects,1.3); chime(1046,1568); }
        if(revPerfects>=3 && localStorage.pulsePhantom!=='1'){
          localStorage.pulsePhantom='1';
          popText($('milestone'),'??? → PHANTOM FOUND',1.4); chime(1046,1568); renderSkinRow(); } }
      if(perfectStreak>=8){
        perfectStreak=0;
        slowmoT=0.22; slowmoS=0.04;
        popText($('milestone'),'FLAWLESS',1.6);
        ringBurst(skin().arc); shockwave(px,py,skin().arc);
        flash=0.5; flashColor='255,255,255'; chime(1568,2093);
      } else if(!didSplit){
        shockwave(px,py,skin().arc); slowmoT=0.07; slowmoS=0.05;
        chime(784+perfectStreak*40, 1046+perfectStreak*40);
      }
    } else { perfectStreak=0; buzz(8);
      if(gold) beep(880+combo*6,0.09,'triangle',0.28);
      else beep(NOTES[Math.min(combo-1,NOTES.length-1)],0.1,'triangle',0.26); }
    if(combo>0&&combo%5===0){ popText($('combo'),'COMBO ×'+(1+Math.floor(combo/5)*0.5),1.25); beep(990,0.14,'sine',0.2); }
    if(sinceShield>=25 && shields<3){ shields++; sinceShield=0; updShields(); beep(1200,0.12,'sine',0.18); }
    if(hits>=nextChest) openChest();
    const ph=Math.floor(hits/50);
    if(ph!==phase){ phase=ph; popText($('milestone'),'PHASE '+(phase+1),1.5);
      flash=0.45; flashColor=hexToRgb(PHASE_COLS[phase%PHASE_COLS.length]); chime(1174,1568); }
    checkMilestone(); checkPalindrome();
    lastRev=didReverse;
    newTarget();
  } else if(dots.length>1 && d<=targetHalf*1.4){
    loseDot(ji,px,py);                        // near-miss while split: the wager takes a dot
  } else if(dots.length===1 && d<=targetHalf*1.4 && shields>0){
    shields--; updShields(); combo=Math.floor(combo/2); perfectStreak=0;
    burst(px,py,'#5ac8ff',10); shake=6; ringPulse=1; flash=0.22; flashColor='90,200,255';
    slowmoT=0.35; slowmoS=0.35; beep(200,0.18,'square',0.24); beep(150,0.12,'square',0.16); buzz(25);
    zen=0; updZen(); lastRev=false;
    if(quest&&quest.type==='clean'){ quest.start=hits; quest.got=0; updQuestHUD(); }
    newTarget();
  } else {
    die(px,py);                               // a wild tap kills — split or not: the wager has a downside
  }
}

function die(px,py){ state=S.dying; dyingT=0; shake=18; flash=0.7; flashColor='255,77,109';
  deathInfo={over:overclockLeft>0,gold,shieldsLeft:shields,ecl:eclipseActive,hits,
    ang:Math.atan2((py||CY)-CY,(px||CX)-CX)};
  if(dots.length>1) beep(98,0.5,'sawtooth',0.25);        // the split wager lost — a deeper sting
  if(best>0&&score>best){ popText($('milestone'),'NEW BEST',1.6);
    for(let i=0;i<4;i++) burst(CX+rand(-R,R)*0.7, CY+rand(-R,R)*0.7,
      PHASE_COLS[Math.floor(Math.random()*PHASE_COLS.length)], 16); }

function epitaph(isBest){
  const di=deathInfo||{};
  if(isBest&&score>0) return 'A new era begins.';
  if(di.ecl) return 'Lost in the dark.';
  if(di.over) return 'Overclocked past the redline.';
  if(best>0&&score<best&&best-score<=2) return 'One tap short. Ouch.';
  if(di.gold) return 'Greed is a hell of a drug.';
  if((di.hits||0)<5) return 'Warming up. Surely.';
  if(di.shieldsLeft>0) return 'Fell with '+di.shieldsLeft+' shield'+(di.shieldsLeft>1?'s':'')+' still in pocket.';
  const pool=['The ring remembers.','Rhythm is a harsh mistress.','The dot waits for no one.','It reads the same backwards.'];
  return pool[Math.floor(Math.random()*pool.length)];
}

// ---- the tally: watch your run add itself up ----
function runTally(items,total,isBest){
  const box=$('tally'), gs=$('gscore'); if(!box||!gs){ tallyDone=true; return; }
  tallyDone=false;
  const easeOQ=t=>1-Math.pow(1-t,4);
  items.forEach(it=>{ const row=document.createElement('div'); row.className='tl';
    row.innerHTML='<span class="lab">'+it[0]+'</span><b>0</b>'; box.appendChild(row); });
  const rows=[...box.children];
  const STAG=140, CNT=280, HOLD=300;
  const endT=(items.length-1)*STAG+CNT+HOLD;
  items.forEach((it,i)=>beep(660+i*60,0.04,'square',0.1,i*STAG/1000)); // rising ladder as lines land
  const t0=performance.now();
  function land(){
    if(tallyDone) return;
    tallyDone=true; tallyEndT=performance.now(); tallySkip=null;
    rows.forEach((r,i)=>{ r.classList.add('in'); r.querySelector('b').textContent=items[i][1]; });
    gs.textContent=total;
    gs.style.transition='none'; gs.style.transform='scale(1.3)';
    requestAnimationFrame(()=>{ gs.style.transition='transform .2s ease-out'; gs.style.transform='scale(1)'; });
    if(isBest){ gs.style.color='#ffd23f'; beep(2093,0.3,'sine',0.18,0.1); }
    flash=0.25; flashColor='255,255,255';
    chime(880,1174); beep(1760,0.25,'sine',0.2,0.09); buzz([15,30,25]);
  }
  tallySkip=land;
  function step(now){
    if(tallyDone) return;
    const t=now-t0; let run=0;
    items.forEach((it,i)=>{ const st=i*STAG;
      if(t>=st) rows[i].classList.add('in');
      const p=Math.min(1,Math.max(0,(t-st)/CNT));
      const v=Math.round(it[1]*easeOQ(p));
      rows[i].querySelector('b').textContent=v; run+=v; });
    gs.textContent=run;
    if(t>=endT){ land(); return; }
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function finalizeDeath(){

  const ascNow=ascRank(lifetime);
  statChests+=runChests; statPerfects+=runPerfects; statComets+=runComets; statSplits+=runSplits;
  localStorage.pulseChests=statChests; localStorage.pulsePerfects=statPerfects;
  localStorage.pulseComets=statComets; localStorage.pulseSplits=statSplits;
  if(runSplitBest>statSplitBest){ statSplitBest=runSplitBest; localStorage.pulseSplitBest=statSplitBest; }
  if(runZenBest>statZenBest){ statZenBest=runZenBest; localStorage.pulseZenBest=statZenBest; }
  lastRunScore=score; localStorage.pulseLast=score;
  if(isBest){ best=score; localStorage.pulseBest=best; }
  let dailyLine='';
  if(dailyMode){ const dk='pulseDaily_'+todayStr();
    if(score>+(localStorage[dk]||0)) localStorage[dk]=score;
    dailyLine=' &nbsp;·&nbsp; DAILY BEST '+localStorage[dk]; }
  justUnlocked=SKINS.filter((s,i)=>i>0&&unlocked(i)&&!unlockedBefore.has(i)).map(s=>s.name);
  snapshotUnlocks();
  let head,sub;
  if(isBest&&score>0){ head='NEW BEST!'; sub='You beat your record'; }
  else if(best>0&&score>=best*0.8&&score<best){ head='SO CLOSE'; sub=(best-score)+' from your BEST'; }
  else { head='GAME OVER'; sub='Best '+best; }
  if(duel){
    if(duel.stage===1){ duel.p1=score; head='PLAYER 1 · '+score; sub='Hold the button to hand over'; }
    else { const p2=score;
      head = p2>duel.p1 ? 'PLAYER 2 WINS' : (p2<duel.p1 ? 'PLAYER 1 WINS' : 'DEAD HEAT');
      sub = 'P1 '+duel.p1+' &nbsp;·&nbsp; P2 '+p2; }
  }
  const mult=(1+Math.floor(comboPeak/5)*0.5).toFixed(1);
  const m=$('msg'); m.classList.remove('hidden');
  m.innerHTML=
    `<div class="wordmark">PALINDROME</div>`+
    `<h1 class="go-head">${head}</h1>`+
    `<p class="big go-score" id="gscore">${score}</p>`+
    `<div id="tally"></div>`+
    `<p style="opacity:.6">${sub} &nbsp;·&nbsp; ${tierFor(score)} &nbsp;·&nbsp; combo peaked ×${mult}${runSplits?' &nbsp;·&nbsp; ⧉ split ×'+runSplits+(runSplitBest?' (ran '+runSplitBest+' hits)':''):''}${runZenBest>=3?' &nbsp;·&nbsp; ☯ zen ×'+runZenBest:''}${dailyLine}</p>`+
    `<p style="opacity:.45;font-style:italic;font-size:.92em">“${epitaph(isBest)}”</p>`+
    (rivalTarget&&!duel?`<p style="color:${score>rivalTarget?'#ffd23f':'#8cdcff'};-webkit-text-fill-color:${score>rivalTarget?'#ffd23f':'#8cdcff'};opacity:.85">${score>rivalTarget?'👑 CROWN TAKEN · ':'⚔ crown missed · '}${score} v ${rivalTarget}</p>`:'')+
    (recordBroken?`<p style="color:#ffd23f;-webkit-text-fill-color:#ffd23f;opacity:.85">⚡ held the record zone for ${recordHits} hits</p>`:'')+
    (runComets?`<p style="color:#8cdcff;-webkit-text-fill-color:#8cdcff;opacity:.85">☄ caught a comet</p>`:'')+
    (justUnlocked.length?`<p style="color:#ffd23f;-webkit-text-fill-color:#ffd23f;margin-top:12px">✦ SKIN UNLOCKED: ${justUnlocked.join(', ')}</p>`:'')+
    (ascNow>ascBefore?`<p style="color:#ffd23f;-webkit-text-fill-color:#ffd23f;margin-top:10px">✦ ASCENSION ${ascNow} REACHED${ascPerkHint(ascNow)}</p>`:'')+
    `<p style="opacity:.5;font-size:.9em;margin-top:12px">🔥 Day ${streak} &nbsp;·&nbsp; Lifetime ${lifetime} &nbsp;·&nbsp; 📦 ${statChests} &nbsp;·&nbsp; 🎯 ${statPerfects} &nbsp;·&nbsp; ◆ ${questsDone} &nbsp;·&nbsp; ⧉ ${statSplits}${statComets?' &nbsp;·&nbsp; ☄ '+statComets:''}</p>`+
    (duel
     ? (duel.stage===1
        ? `<div class="row" data-ui><button data-ui id="holdBtn">HOLD ▸ PLAYER 2</button><button data-ui id="exitDuelBtn">EXIT ▸ SOLO</button></div>`
        : `<div class="row" data-ui><button data-ui id="rematchBtn">⚔ REMATCH</button><button data-ui id="exitDuelBtn">EXIT ▸ SOLO</button></div>`)
     : `<div class="row" data-ui>`+
       `<button data-ui id="shareBtn">SHARE CARD</button>`+
       `<button data-ui id="copyBtn">COPY TEXT</button>`+
       `<button data-ui id="againBtn">PLAY AGAIN ▸</button>`+
       `</div>`+
       `<div class="row" data-ui><button data-ui id="dailyBtn">DAILY RUN</button><button data-ui id="vsBtn">⚔ VS</button><button data-ui id="duelBtn">⚔ DUEL 2P</button></div>`+
       `<div class="row" id="skinrow" data-ui></div>`+
       `<p style="opacity:.35;font-size:.85em;margin-top:16px">tap anywhere to retry</p>`);
  renderSkinRow(); wireModeButtons(); refreshDailyBtn();
  if(duel){
    const ex=$('exitDuelBtn'); if(ex) ex.onclick=e=>{ e.stopPropagation(); duel=null; refreshDailyBtn(); reset(); };
    if(duel.stage===1){ wireHold($('holdBtn'),()=>{ duel.stage=2; reset(); }); }
    else { const rb=$('rematchBtn'); if(rb) rb.onclick=e=>{ e.stopPropagation();
      duel={seed:(Math.random()*4294967296)>>>0, stage:1, p1:0}; reset(); }; }
  } else {
    $('againBtn').onclick=e=>{ e.stopPropagation(); reset(); };
    $('shareBtn').onclick=e=>{ e.stopPropagation(); shareCard($('shareBtn')); };
    if(isBest&&score>0) $('shareBtn').classList.add('pulse');   // the record-break death is THE share moment
    $('copyBtn').onclick=e=>{ e.stopPropagation();
      const sup = runSplitBest>=5?('⧉ survived '+runSplitBest+' split'):(runZenBest>=4?('☯ zen ×'+runZenBest):('combo ×'+mult));
      const txt = crowned
        ? `PALINDROME 👑 Took your crown on DAILY ${todayStr()} — ${score} v ${rivalTarget}. Reclaim it?${statCrowns>1?' (crowns ×'+statCrowns+')':''}`
        : (dailyMode
          ? `PALINDROME DAILY ${todayStr()} — ${score} pts · ${tierFor(score)}. Same orbit, same chests, zero excuses. Beat me.`
          : `PALINDROME · ${score} — ${tierFor(score)} · ${sup} 🎯 can you beat it?`);
      try{ navigator.clipboard.writeText(txt); $('copyBtn').textContent='COPIED ✓'; }catch(_){ $('copyBtn').textContent=txt; } };
  }
  // the tally — the run adds itself up
  const items=[];
  if(led.hit) items.push(['TAPS ×'+(hits-runPerfects),led.hit]);
  if(led.perf) items.push(['PERFECTS ×'+runPerfects,led.perf]);
  if(led.chest) items.push(['📦 CHESTS',led.chest]);
  if(led.quest) items.push(['◆ QUESTS',led.quest]);
  if(led.zen) items.push(['☯ ZEN',led.zen]);
  if(led.ecl) items.push(['☀ ECLIPSE',led.ecl]);
  if(led.rev) items.push(['⚔ REVENGE',led.rev]);
  if(items.length&&score>0){ $('gscore').textContent='0'; runTally(items,score,isBest&&score>0); }
  else tallyDone=true;
}

// ---- loop ----
let last=performance.now();
function frame(now){
  let rdt=Math.min(0.05,(now-last)/1000); last=now;

  if(state===S.dying){ dyingT+=rdt;
    timeScale = dyingT<0.12 ? 0.08 : Math.min(1,0.08+(dyingT-0.12)*2);
    if(dyingT>0.55) finalizeDeath();
  } else if(slowmoT>0){ slowmoT-=rdt; timeScale=slowmoS; }
  else timeScale=1;
  const dt=rdt*timeScale;

  if(state===S.play){
    dots.forEach(dot=>{ dot.ang+=dot.dir*effSpeed()*dt;
      if(dot.ang>Math.PI*2)dot.ang-=Math.PI*2; if(dot.ang<0)dot.ang+=Math.PI*2; });
    // judged-dot selection with hysteresis so the bracket doesn't flicker between near-equidistant dots
    if(dots.length>1){ const nd2=nearestDot();
      const cur=dots[Math.min(judgedIdx,dots.length-1)];
      const cd=Math.abs(angleDiff(cur.ang,targetA));
      if(nd2.i!==judgedIdx && nd2.d < cd-0.15) judgedIdx=nd2.i;
    } else judgedIdx=0;
    // short velocity tail, always on — direction is felt, not inferred
    dots.forEach(dot=>vtrail.push({x:CX+Math.cos(dot.ang)*R,y:CY+Math.sin(dot.ang)*R,a:0.3}));
    while(vtrail.length>7*dots.length) vtrail.shift();
    const dmin=Math.min(...dots.map(dot=>Math.abs(angleDiff(dot.ang,targetA))));
    const tti=dmin/effSpeed();
    while(tickIdx<TICKB.length && tti<TICKB[tickIdx]){
      beep(TICKF[tickIdx],0.035,'sine',(eclipseActive?0.02:0.06)+tickIdx*0.012); tickIdx++; }
    if(tti>0.4) tickIdx=0;
    if(!eclipseActive){ hbT+=rdt; const beatT=Math.max(0.30,0.85-(speed-2.1)*0.08);
      if(hbT>=beatT){ hbT=0; beep(120,0.09,'sine',0.06); beep(96,0.12,'sine',0.05); } }
    if(ascRank(lifetime)>=3 || cometActive){
      dots.forEach(dot=>trail.push({x:CX+Math.cos(dot.ang)*R,y:CY+Math.sin(dot.ang)*R,a:cometActive?0.8:0.5}));
      const cap=(cometActive?22:14)*dots.length;
      while(trail.length>cap) trail.shift();
    }
    blinkT+=rdt; if(blinkT>blinkNext){ blinkT=0; blinkNext=5+Math.random()*5; blinkOn=0.14; }
    blinkOn=Math.max(0,blinkOn-rdt);
  }
  if(state===S.menu||state===S.dead){
    idleT+=rdt;
    if(idleAnim<0 && idleT>8){ idleT=0;
      let v; do{ v=Math.floor(Math.random()*3); }while(v===idleLast);
      idleAnim=v; idleLast=v; idleAnimT=0; }
    if(idleAnim>=0){ idleAnimT+=rdt; if(idleAnimT>0.9) idleAnim=-1; }
  } else { idleT=0; idleAnim=-1; }

  trail.forEach(t=>{ t.a-=rdt*1.4; }); trail=trail.filter(t=>t.a>0);
  vtrail.forEach(t=>{ t.a-=rdt*2.4; }); vtrail=vtrail.filter(t=>t.a>0);
  shake*=0.86; ringPulse*=0.90; flash*=0.88; reversalGlow*=0.90;
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.vx*=0.97; p.life-=rdt*1.6; });
  particles=particles.filter(p=>p.life>0);
  shocks.forEach(s=>{ s.r+=640*rdt; s.a-=rdt*1.8; });
  shocks=shocks.filter(s=>s.a>0);

  ctx.clearRect(0,0,W,H);
  const sx=(Math.random()-0.5)*shake, sy=(Math.random()-0.5)*shake;
  ctx.save(); ctx.translate(sx,sy);

  if(state===S.play && phase>0 && !eclipseActive){
    ctx.fillStyle='rgba('+hexToRgb(PHASE_COLS[phase%PHASE_COLS.length])+',0.05)';
    ctx.fillRect(-sx-50,-sy-50,W+100,H+100);
  }
  if(state===S.play && combo>2 && !TINY && !eclipseActive){
    const vi=Math.min(0.42,combo*0.018), sk=skin();
    const vg=ctx.createRadialGradient(CX,CY,R*0.6,CX,CY,Math.max(W,H)*0.7);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1,'rgba('+hexToRgb(sk.arc)+','+vi+')');
    ctx.fillStyle=vg; ctx.fillRect(-sx-50,-sy-50,W+100,H+100);
  }
  if(state===S.play && eclipseActive){
    ctx.fillStyle='rgba(2,2,8,0.62)'; ctx.fillRect(-sx-50,-sy-50,W+100,H+100);
  }

  ctx.lineWidth=6;
  ctx.strokeStyle='rgba('+(reversalGlow>0.05?'255,210,63':'255,255,255')+','+(0.10+ringPulse*0.25+reversalGlow*0.4)+')';
  ctx.beginPath(); ctx.arc(CX,CY,R+ringPulse*8,0,Math.PI*2); ctx.stroke();

  if(state===S.play||state===S.dying){
    const sk=skin();
    if(state===S.play && shields>0 && dots.length===1 && !eclipseActive){
      ctx.lineWidth=18; ctx.strokeStyle='rgba(90,200,255,.09)';
      ctx.beginPath(); ctx.arc(CX,CY,R,targetA-targetHalf*1.4,targetA+targetHalf*1.4); ctx.stroke(); }
    const dmin=Math.min(...dots.map(dot=>Math.abs(angleDiff(dot.ang,targetA))));
    const pArc=Math.max(0,1-dmin/0.6);
    if(eclipseActive){ ctx.lineWidth=5; ctx.strokeStyle='#dfe8ff'; ctx.shadowColor='#dfe8ff'; ctx.shadowBlur=blur(16); }
    else { ctx.lineWidth=14+pArc*8; ctx.strokeStyle=gold?'#ffd23f':sk.arc; ctx.shadowColor=ctx.strokeStyle; ctx.shadowBlur=blur(22+pArc*22); }
    ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(CX,CY,R,targetA-targetHalf,targetA+targetHalf); ctx.stroke();
    ctx.shadowBlur=0; ctx.lineCap='butt';
    // midpoint notch — subtle; the split point is whispered, not shouted
    if(!eclipseActive && state===S.play){
      ctx.strokeStyle='rgba(255,255,255,.28)'; ctx.lineWidth=1.5;
      const mx=Math.cos(targetA), my=Math.sin(targetA);
      ctx.beginPath(); ctx.moveTo(CX+mx*(R-6),CY+my*(R-6)); ctx.lineTo(CX+mx*(R+6),CY+my*(R+6)); ctx.stroke();
    }
    // hot edges — the exit-speed map stays visible, gold included (deeper tint there)
    if(!eclipseActive && state===S.play){
      ctx.lineCap='round'; ctx.lineWidth=(14+pArc*8)*0.6;
      ctx.strokeStyle=gold?'rgba(255,77,69,.5)':'rgba(255,122,69,.4)';
      ctx.beginPath(); ctx.arc(CX,CY,R,targetA-targetHalf,targetA-targetHalf*0.72); ctx.stroke();
      ctx.beginPath(); ctx.arc(CX,CY,R,targetA+targetHalf*0.72,targetA+targetHalf); ctx.stroke();
      ctx.lineCap='butt';
    }
    if(tightSpawn && state===S.play && !eclipseActive){   // a reversed spawn: closer, but tighter — shown, not told
      ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.lineWidth=2; ctx.setLineDash([3,6]);
      ctx.beginPath(); ctx.arc(CX,CY,R-12,targetA-targetHalf,targetA+targetHalf); ctx.stroke(); ctx.setLineDash([]);
    }
    if(state===S.play){
      const nm=MILESTONES.find(m=>!milestonesHit.has(m)&&m>score&&m-score<=3);
      if(nm){ ctx.font='900 '+Math.round(R*0.55)+'px Segoe UI,sans-serif'; ctx.textAlign='center';
        ctx.fillStyle='rgba(255,255,255,'+(0.06+0.05*Math.sin(now/180))+')';
        ctx.fillText(nm,CX,CY+R*0.18); }
    }
    trail.forEach(t=>{ ctx.globalAlpha=Math.max(0,t.a); ctx.fillStyle=cometActive?'#8cdcff':sk.dot;
      ctx.beginPath(); ctx.arc(t.x,t.y,cometActive?5:4,0,Math.PI*2); ctx.fill(); });
    ctx.globalAlpha=1;
    vtrail.forEach(t=>{ ctx.globalAlpha=Math.max(0,t.a); ctx.fillStyle=sk.dot;
      ctx.beginPath(); ctx.arc(t.x,t.y,3,0,Math.PI*2); ctx.fill(); });
    ctx.globalAlpha=1;
    // bracket the dot the game will judge next (two-dot clarity, hysteresis-stable)
    if(state===S.play && dots.length>1){
      const jb=dots[Math.min(judgedIdx,dots.length-1)];
      const bx=CX+Math.cos(jb.ang)*R, by=CY+Math.sin(jb.ang)*R;
      ctx.globalAlpha=0.6; ctx.strokeStyle='#fff'; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(bx,by,15,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=1;
    }
    if(state===S.play && best>0 && !recordBroken && score>=best-5 && score<=best){
      const gx=CX+Math.cos(dots[0].ang+Math.PI)*R, gy=CY+Math.sin(dots[0].ang+Math.PI)*R;
      ctx.globalAlpha=0.28; ctx.fillStyle='#ffd23f';
      ctx.beginPath(); ctx.arc(gx,gy,7,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1;
    }
    dots.forEach((dot,i)=>{
      const d=Math.abs(angleDiff(dot.ang,targetA)), p=Math.max(0,1-d/0.6);
      const dx=CX+Math.cos(dot.ang)*R, dy=CY+Math.sin(dot.ang)*R;
      if(dots.length>1 && i!==judgedIdx) ctx.globalAlpha=0.7;   // the off-duty dot steps back
      ctx.fillStyle=cometActive?'#8cdcff':(i===1?sk.arc:sk.dot); ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=blur(14+p*26);
      ctx.beginPath(); ctx.arc(dx,dy,(cometActive?12:9)+p*6,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
      ctx.globalAlpha=1;
      if(blinkOn>0 && !cometActive && state===S.play){
        ctx.fillStyle='#0a0a12'; ctx.beginPath(); ctx.arc(dx+3,dy-3,7+p*4,0,Math.PI*2); ctx.fill(); }
    });
  }

  if(state===S.menu||state===S.dead){
    const sk=skin(); let ix=CX, iy=CY-R, rx=9, ry=9;
    if(idleAnim===0){ const w=Math.sin(idleAnimT*14)*0.25*Math.exp(-idleAnimT*2);
      rx=9*(1+w); ry=9*(1-w); }
    else if(idleAnim===1){ iy-=Math.abs(Math.sin(idleAnimT*7))*10*Math.exp(-idleAnimT*1.5); }
    ctx.fillStyle=sk.dot; ctx.shadowColor=sk.dot; ctx.shadowBlur=blur(12);
    ctx.beginPath(); ctx.ellipse(ix,iy,rx,ry,0,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
    if(idleAnim===2 && idleAnimT<0.45){
      ctx.fillStyle='#0a0a12'; ctx.beginPath(); ctx.arc(ix+3,iy-2,7,0,Math.PI*2); ctx.fill(); }
  }

  shocks.forEach(s=>{ ctx.globalAlpha=Math.max(0,s.a); ctx.strokeStyle=s.color; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.stroke(); });
  ctx.globalAlpha=1;
  particles.forEach(p=>{ ctx.globalAlpha=Math.max(0,Math.min(1,p.life)); ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); });
  ctx.globalAlpha=1; ctx.restore();

  if(flash>0.01){ ctx.fillStyle='rgba('+flashColor+','+flash*0.5+')'; ctx.fillRect(0,0,W,H); }
  requestAnimationFrame(frame);
}
let idleT=0,idleAnim=-1,idleAnimT=0,idleLast=-1;
function hexToRgb(h){ const n=parseInt(h.slice(1),16); return (n>>16&255)+','+(n>>8&255)+','+(n&255); }
requestAnimationFrame(frame);

// ---- input ----
function onDown(e){ if(e.target.closest&&e.target.closest('[data-ui]')) return;
  e.preventDefault(); if(AC&&AC.state==='suspended')AC.resume(); tap(); }
window.addEventListener('mousedown',onDown);
window.addEventListener('touchstart',onDown,{passive:false});
window.addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); if(AC&&AC.state==='suspended')AC.resume(); tap(); }});
</script>
