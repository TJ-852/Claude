<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>PULSE</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a12;overflow:hidden;
    font-family:'Segoe UI',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;background:radial-gradient(circle at 50% 42%,#141426 0%,#0a0a12 70%)}
  #hud{position:fixed;top:0;left:0;right:0;padding:18px 22px;display:flex;
    justify-content:space-between;pointer-events:none;color:#fff;z-index:5}
  .score{font-size:44px;font-weight:800;letter-spacing:1px;line-height:1;
    text-shadow:0 2px 18px rgba(90,200,255,.35)}
  .sub{font-size:13px;opacity:.55;letter-spacing:2px;margin-top:4px;text-transform:uppercase}
  .best{text-align:right;font-size:15px;opacity:.6;letter-spacing:1px}
  #combo{position:fixed;left:0;right:0;top:38%;text-align:center;pointer-events:none;
    color:#ffd23f;font-weight:800;font-size:26px;opacity:0;letter-spacing:1px;z-index:5}
  #msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;color:#fff;text-align:center;z-index:10;
    background:rgba(10,10,18,.72);backdrop-filter:blur(3px)}
  #msg h1{font-size:64px;margin:0;font-weight:900;letter-spacing:6px;
    background:linear-gradient(90deg,#5ac8ff,#ffd23f);-webkit-background-clip:text;
    background-clip:text;color:transparent}
  #msg p{opacity:.7;font-size:16px;letter-spacing:1px;margin:14px 0 0}
  #msg .big{font-size:20px;opacity:.9;margin-top:22px}
  .pill{margin-top:26px;padding:13px 30px;border:1.5px solid rgba(255,255,255,.25);
    border-radius:40px;font-size:14px;letter-spacing:2px;opacity:.85}
  .hidden{display:none!important}
</style>

<div id="wrap"><canvas id="c"></canvas></div>
<div id="hud">
  <div><div class="score" id="score">0</div><div class="sub">Score</div></div>
  <div class="best">BEST<br><span id="best">0</span></div>
</div>
<div id="combo"></div>
<div id="msg">
  <h1>PULSE</h1>
  <p>Tap when the dot crosses the <b style="color:#5ac8ff">glowing arc</b></p>
  <p class="big" id="mtip">Tap / Space to start</p>
  <div class="pill">ONE TAP · DON'T MISS</div>
</div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let W, H, CX, CY, R;            // canvas + ring geometry
function resize(){
  const s = Math.min(window.innerWidth, window.innerHeight);
  W = cv.width = window.innerWidth; H = cv.height = window.innerHeight;
  CX = W/2; CY = H*0.46; R = s*0.30;
}
window.addEventListener('resize', resize); resize();

// ---- audio (tiny WebAudio synth, no assets) ----
let AC;
function beep(freq, dur=0.08, type='sine', vol=0.25){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    o.connect(g); g.connect(AC.destination);
    const t = AC.currentTime;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.start(t); o.stop(t+dur);
  }catch(e){}
}

// ---- state ----
const S = { menu:0, play:1, dead:2 };
let state = S.menu;
let score = 0, best = +(localStorage.pulseBest||0), combo = 0;
let ang = 0, dir = 1, speed = 0, targetA = 0, targetHalf = 0.42, gold = false;
let shake = 0, ringPulse = 0, flash = 0, deadT = 0;
let particles = [];
$('best').textContent = best;

function rand(a,b){ return a + Math.random()*(b-a); }

function newTarget(){
  // place the target arc away from the dot's current position
  let a;
  do { a = rand(0, Math.PI*2); } while (Math.abs(angleDiff(a, ang)) < 0.9);
  targetA = a;
  targetHalf = Math.max(0.16, 0.42 - score*0.006);   // arc shrinks as you improve
  gold = Math.random() < 0.14;                        // occasional bonus target
}
function angleDiff(a,b){ let d=(a-b)%(Math.PI*2); if(d>Math.PI)d-=Math.PI*2; if(d<-Math.PI)d+=Math.PI*2; return d; }

function start(){
  score = 0; combo = 0; ang = -Math.PI/2; dir = 1;
  speed = 2.1; particles = []; deadT = 0;
  $('score').textContent = 0;
  newTarget();
  state = S.play;
  $('msg').classList.add('hidden');
}

function burst(x,y,color,n){
  for(let i=0;i<n;i++){
    const a = rand(0,Math.PI*2), sp = rand(1.5,7);
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color,r:rand(2,5)});
  }
}

function showCombo(txt){
  const el = $('combo'); el.textContent = txt;
  el.style.transition='none'; el.style.opacity=1; el.style.transform='scale(1.25)';
  requestAnimationFrame(()=>{ el.style.transition='all .5s ease-out';
    el.style.opacity=0; el.style.transform='scale(1)'; });
}

function tap(){
  if(state===S.menu){ start(); return; }
  if(state===S.dead){ if(deadT>0.5) reset(); return; }
  if(state!==S.play) return;

  const dot = ang;
  const d = Math.abs(angleDiff(dot, targetA));
  if(d <= targetHalf){
    // HIT
    const perfect = d <= targetHalf*0.35;
    combo++;
    let gain = (perfect?2:1) * (gold?3:1);
    gain *= 1 + Math.floor(combo/5)*0.5;             // combo multiplier
    gain = Math.round(gain);
    score += gain;
    $('score').textContent = score;
    speed += 0.14;                                    // escalate
    dir *= (Math.random()<0.42 ? -1 : 1);             // sometimes reverse — keeps you honest
    const px = CX+Math.cos(dot)*R, py = CY+Math.sin(dot)*R;
    burst(px,py, gold?'#ffd23f':(perfect?'#5ac8ff':'#7CFC9E'), gold?26:(perfect?16:10));
    shake = perfect?9:5; ringPulse = 1; flash = gold?0.5:0;
    beep(gold?880:(perfect?660:520) + combo*6, 0.09, 'triangle', 0.28);
    if(combo>0 && combo%5===0){ showCombo('COMBO ×'+(1+Math.floor(combo/5)*0.5)); beep(990,0.14,'sine',0.2); }
    newTarget();
  } else {
    die();
  }
}

function die(){
  state = S.dead; deadT = 0;
  shake = 16; flash = 0.7;
  const px = CX+Math.cos(ang)*R, py = CY+Math.sin(ang)*R;
  burst(px,py,'#ff4d6d',30);
  beep(160,0.3,'sawtooth',0.3);
  if(score>best){ best=score; localStorage.pulseBest=best; $('best').textContent=best; }
  const m=$('msg'); m.classList.remove('hidden');
  m.innerHTML = `<h1 style="font-size:34px;letter-spacing:3px">${score>best-1&&score>0&&score===best?'NEW BEST!':'GAME OVER'}</h1>`+
    `<p class="big" style="font-size:52px;margin-top:6px;color:#fff;-webkit-text-fill-color:#fff">${score}</p>`+
    `<p>Best ${best} &nbsp;·&nbsp; Combo peaked ×${(1+Math.floor(combo/5)*0.5).toFixed(1)}</p>`+
    `<div class="pill">TAP TO PLAY AGAIN</div>`;
}
function reset(){ $('msg').classList.add('hidden'); start(); }

// ---- loop ----
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05,(now-last)/1000); last = now;

  if(state===S.play){
    ang += dir*speed*dt;
    if(ang>Math.PI*2) ang-=Math.PI*2; if(ang<0) ang+=Math.PI*2;
  }
  if(state===S.dead) deadT += dt;

  shake *= 0.86; ringPulse *= 0.90; flash *= 0.88;
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.vx*=0.97; p.life-=dt*1.6; });
  particles = particles.filter(p=>p.life>0);

  // draw
  ctx.clearRect(0,0,W,H);
  const sx=(Math.random()-0.5)*shake, sy=(Math.random()-0.5)*shake;
  ctx.save(); ctx.translate(sx,sy);

  // base ring
  ctx.lineWidth = 6;
  ctx.strokeStyle = 'rgba(255,255,255,'+(0.10+ringPulse*0.25)+')';
  ctx.beginPath(); ctx.arc(CX,CY,R+ringPulse*8,0,Math.PI*2); ctx.stroke();

  if(state!==S.menu){
    // target arc
    ctx.lineWidth = 14;
    ctx.lineCap='round';
    ctx.strokeStyle = gold?'#ffd23f':'#5ac8ff';
    ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 22;
    ctx.beginPath(); ctx.arc(CX,CY,R, targetA-targetHalf, targetA+targetHalf); ctx.stroke();
    ctx.shadowBlur = 0; ctx.lineCap='butt';

    // dot
    const dx=CX+Math.cos(ang)*R, dy=CY+Math.sin(ang)*R;
    ctx.fillStyle='#fff'; ctx.shadowColor='#fff'; ctx.shadowBlur=18;
    ctx.beginPath(); ctx.arc(dx,dy,9,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }

  // particles
  particles.forEach(p=>{ ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); });
  ctx.globalAlpha=1;
  ctx.restore();

  if(flash>0.01){ ctx.fillStyle='rgba(255,255,255,'+flash*0.5+')'; ctx.fillRect(0,0,W,H); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- input ----
function onDown(e){ e.preventDefault(); if(AC&&AC.state==='suspended')AC.resume(); tap(); }
window.addEventListener('mousedown', onDown);
window.addEventListener('touchstart', onDown, {passive:false});
window.addEventListener('keydown', e=>{ if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); onDown(e);} });
</script>
